name: Build & Deploy Wireguard management service

run-name: 'Deploy Wireguard → ${{ inputs.environment }}'

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Target environment'
                required: true
                type: environment

concurrency:
    group: vpn-wireguard-${{ inputs.environment }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        uses: ./.github/workflows/deploy-vpn-service.yml
        secrets: inherit
        with:
            environment: ${{ inputs.environment }}
            title: Wireguard management service
            services: wg_service
            env_dirs: wireguard
