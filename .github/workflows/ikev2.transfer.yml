name: Build & Deploy IKEv2 management service

run-name: 'Deploy IKEv2 → ${{ inputs.environment }}'

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Target environment'
                required: true
                type: environment

concurrency:
    group: vpn-ikev2-${{ inputs.environment }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        uses: ./.github/workflows/deploy-vpn-service.yml
        secrets: inherit
        with:
            environment: ${{ inputs.environment }}
            title: IKEv2 management service
            services: ikev2_service
            env_dirs: ikev2
