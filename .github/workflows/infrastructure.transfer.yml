name: Build & Deploy VPN Infrastructure

run-name: 'Deploy VPN Infrastructure → ${{ inputs.environment }}'

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Target environment'
                required: true
                type: environment

concurrency:
    group: vpn-infrastructure-${{ inputs.environment }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        uses: ./.github/workflows/deploy-vpn-service.yml
        secrets: inherit
        with:
            environment: ${{ inputs.environment }}
            title: VPN infrastructure (IKEv2, WireGuard, OpenVPN)
            services: ikev2_service wg_service openvpn_service
            env_dirs: ikev2 wireguard openvpn
