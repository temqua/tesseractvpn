name: Build & Deploy OpenVPN Management Service

run-name: 'Deploy OpenVPN → ${{ inputs.environment }}'

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Target environment'
                required: true
                type: environment

concurrency:
    group: vpn-openvpn-${{ inputs.environment }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        uses: ./.github/workflows/deploy-vpn-service.yml
        secrets: inherit
        with:
            environment: ${{ inputs.environment }}
            title: OpenVPN management service
            services: openvpn_service
            env_dirs: openvpn
