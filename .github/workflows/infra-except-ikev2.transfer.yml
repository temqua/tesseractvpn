name: Build & Deploy VPN Infrastructure Excepting IKEv2

run-name: 'Deploy VPN Infrastructure (without IKEv2) → ${{ inputs.environment }}'

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Target environment'
                required: true
                type: environment

concurrency:
    group: vpn-infrastructure-except-ikev2-${{ inputs.environment }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        uses: ./.github/workflows/deploy-vpn-service.yml
        secrets: inherit
        with:
            environment: ${{ inputs.environment }}
            title: VPN infrastructure (WireGuard, OpenVPN)
            services: wg_service openvpn_service
            env_dirs: wireguard openvpn
